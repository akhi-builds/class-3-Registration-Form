<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Form</title>
</head>
<body>
 <h1>Registration Form</h1>
 <form action="#" method="post">
  <h3>Your Name</h3>
  <input type="text" placeholder="Your Name">
<h3>Your Email</h3>
<input type="email" placeholder="Your Email">
<h3>Your Password</h3>
<input type="password" placeholder="Your Password">
<h3>Your Number</h3>
<input type="number" placeholder="Your Number">
<h3>Your DOB</h3>
<input type="date" name="DOB">
<h3>Your FVT color</h3>
<input type="color">
<h3>Your Gender</h3>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others
<h3>Your Hobbies</h3>
<input type="checkbox" name="Hobbies">Travel
<input type="checkbox" name="Hobbies">Cooking
<input type="checkbox" name="Hobbies">Gerdening
<h3>Your Country</h3>
<select>
  <option>Bangladesh</option>
  <option>India</option>
  <option>Pakistan</option>
  <option>Canada</option>
</select>
<h1>Your Picture</h1>
<input type="file">
<h3>Your Address</h3>
<textarea placeholder="Enter your address"></textarea>
<button type="submit">Registration Now</button>
 </form>
</body>
</html>
